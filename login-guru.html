<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <title>Login Guru</title>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="notify.js"></script>
    <script>typeof window.notify==='undefined'&&(window.notify=function(m,t){if(t!=='success'&&t!=='info')alert(m);},window.pwmClose=function(){});</script>
    <style>
        /* Variabel Warna Sesuai Palet */
        :root {
            --bg-color: #fffffe;
            --headline-color: #272343;
            --paragraph-color: #2d334a;
            --button-bg: #ffd803;
            --button-text: #272343;
            --stroke-color: #272343;
            --secondary-color: #e3f6f5;
            --tertiary-color: #bae8e8;
        }

        /* Reset CSS Dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Latar belakang diubah sedikit agar form lebih menonjol */
            background-color: var(--secondary-color); 
            color: var(--paragraph-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Bagian Header */
        header {
            padding: 20px 40px;
            background-color: var(--bg-color);
            border-bottom: 3px solid var(--stroke-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 {
            color: var(--headline-color);
            font-size: 28px;
            text-decoration: none;
        }

        /* Kontainer Utama Form */
        .container {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Kotak Login */
        .login-box {
            background-color: var(--bg-color);
            border: 3px solid var(--stroke-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 8px 8px 0px var(--stroke-color); /* Efek tebal ala game */
        }

        .login-box h2 {
            color: var(--headline-color);
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }

        .login-box p {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Grup Input Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--headline-color);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 3px solid var(--stroke-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--headline-color);
            transition: all 0.2s;
        }

        /* Animasi saat input sedang diisi (Fokus) */
        .form-group input:focus {
            outline: none;
            border-color: var(--button-bg);
            box-shadow: 4px 4px 0px var(--tertiary-color);
        }

        /* Tombol Utama */
        .btn {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 3px solid var(--stroke-color);
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 4px 4px 0px var(--stroke-color);
            transition: all 0.1s;
            margin-top: 10px;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--stroke-color);
        }

        /* Tautan Kembali */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--headline-color);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--button-bg);
            text-decoration: underline;
        }

        /* Tautan pindah form (Daftar / Lupa kata sandi) */
        .lupa-link {
            display: block;
            text-align: right;
            margin-top: 8px;
            font-size: 14px;
        }
        .login-box .switch-link { margin: 20px 0 0; font-size: 15px; }
        .lupa-link, .switch-link a { color: var(--headline-color); font-weight: 800; }

        /* ===== RESPONSIVE MOBILE ===== */
        @media (max-width: 640px) {
            header { padding: 14px 20px; }
            header h1 { font-size: 20px; }
            header lottie-player { width: 44px !important; height: 44px !important; }
            .container { padding: 16px; }
            .login-box { padding: 28px 22px; border-radius: 14px; box-shadow: 4px 4px 0 var(--stroke-color); }
            .login-box h2 { font-size: 22px; }
            .form-group input { padding: 12px 14px; font-size: 15px; }
            .btn { font-size: 15px; padding: 12px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <lottie-player
            src="PlaywithMe.json"
            background="transparent"
            speed="1"
            style="width: 60px; height: 60px;"
            loop
            autoplay>
        </lottie-player>
        <h1>PlaywithME</h1>
    </header>

    <div class="container">
        <div class="login-box">
            <!-- Form yang tampil dipilih lewat hash URL: #daftar, #lupa, selain itu Masuk -->
            <form id="formMasuk">
                <h2>Portal Guru</h2>
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" placeholder="guru@sekolah.com" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                    <a href="#lupa" class="lupa-link">Lupa kata sandi?</a>
                </div>

                <button type="submit" class="btn">Masuk</button>
                <p class="switch-link">Belum punya akun? <a href="#daftar">Daftar di sini</a></p>
            </form>

            <form id="formDaftar" hidden>
                <h2>Daftar Akun Guru</h2>
                <div class="form-group">
                    <label for="emailDaftar">Alamat Email</label>
                    <input type="email" id="emailDaftar" placeholder="guru@sekolah.com" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="passwordDaftar">Kata Sandi</label>
                    <input type="password" id="passwordDaftar" placeholder="Minimal 6 karakter" autocomplete="new-password" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="konfirmasiDaftar">Ulangi Kata Sandi</label>
                    <input type="password" id="konfirmasiDaftar" placeholder="Ketik ulang kata sandi" autocomplete="new-password" minlength="6" required>
                </div>

                <button type="submit" class="btn">Buat Akun</button>
                <p class="switch-link">Sudah punya akun? <a href="#masuk">Masuk</a></p>
            </form>

            <form id="formLupa" hidden>
                <h2>Lupa Kata Sandi?</h2>
                <p>Masukkan email akunmu. Kami akan mengirim link untuk membuat kata sandi baru.</p>
                <div class="form-group">
                    <label for="emailLupa">Alamat Email</label>
                    <input type="email" id="emailLupa" placeholder="guru@sekolah.com" autocomplete="username" required>
                </div>

                <button type="submit" class="btn">Kirim Link Reset</button>
                <p class="switch-link"><a href="#masuk">← Kembali ke Masuk</a></p>
            </form>

            <a href="index.html" class="back-link">← Kembali ke Halaman Utama</a>
        </div>
    </div>

    <script>
        // Tampilkan form sesuai hash URL; email yang sudah diketik ikut terbawa
        function tampilkanForm() {
            const aktif = document.getElementById({ '#daftar': 'formDaftar', '#lupa': 'formLupa' }[location.hash] || 'formMasuk');
            const email = document.querySelector('.login-box form:not([hidden]) input[type="email"]').value;
            document.querySelectorAll('.login-box form').forEach(f => f.hidden = f !== aktif);
            if (email) aktif.querySelector('input[type="email"]').value = email;
        }
        window.addEventListener('hashchange', tampilkanForm);
        tampilkanForm();
    </script>

    <script type="module">
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        // Import 'auth' dari file konfigurasi yang kita buat tadi
        import { auth } from "./firebase-config.js";

        auth.languageCode = 'id'; // Email reset kata sandi dikirim dalam Bahasa Indonesia

        const PESAN_ERROR = {
            'auth/invalid-credential':     'Email atau kata sandi salah. Periksa kembali!',
            'auth/email-already-in-use':   'Email ini sudah terdaftar. Silakan masuk, atau klik "Lupa kata sandi?".',
            'auth/weak-password':          'Kata sandi terlalu lemah, minimal 6 karakter.',
            'auth/invalid-email':          'Format email tidak valid.',
            'auth/too-many-requests':      'Terlalu banyak percobaan. Coba lagi nanti.',
            'auth/network-request-failed': 'Gagal terhubung. Periksa koneksi internet kamu.',
        };

        const nilai = (id) => document.getElementById(id).value;

        // Tombol jadi "loading" selama proses; error Firebase diterjemahkan ke pesan yang mudah dipahami
        function pasangForm(idForm, teksLoading, aksi) {
            const form = document.getElementById(idForm);
            const btn  = form.querySelector('button[type="submit"]');
            form.addEventListener('submit', async (e) => {
                e.preventDefault(); // Mencegah halaman reload otomatis
                const teksAwal = btn.innerText;
                btn.innerText = teksLoading;
                btn.disabled = true;
                try {
                    await aksi();
                } catch (error) {
                    console.error("Error Code:", error.code);
                    notify(PESAN_ERROR[error.code] || "Terjadi kesalahan: " + error.message, 'error');
                } finally {
                    btn.innerText = teksAwal;
                    btn.disabled = false;
                }
            });
        }

        function keDashboard(pesan) {
            notify(pesan, 'success');
            setTimeout(() => window.location.href = 'dashboard-guru.html', 1600);
        }

        pasangForm('formMasuk', 'Memeriksa...', async () => {
            await signInWithEmailAndPassword(auth, nilai('email'), nilai('password'));
            keDashboard("Login berhasil! Mengalihkan ke Dashboard...");
        });

        pasangForm('formDaftar', 'Membuat akun...', async () => {
            if (nilai('passwordDaftar') !== nilai('konfirmasiDaftar')) {
                notify("Kata sandi dan ulangan kata sandi tidak sama.", 'error');
                return;
            }
            await createUserWithEmailAndPassword(auth, nilai('emailDaftar'), nilai('passwordDaftar'));
            keDashboard("Akun berhasil dibuat! Mengalihkan ke Dashboard...");
        });

        pasangForm('formLupa', 'Mengirim...', async () => {
            await sendPasswordResetEmail(auth, nilai('emailLupa'));
            // Pesan sengaja netral: Firebase tidak memberi tahu apakah email itu terdaftar
            notify("Jika email terdaftar, link reset kata sandi sudah dikirim. Cek juga folder Spam.", 'success', 8000);
            location.hash = 'masuk';
        });
    </script>

</body>
</html>
